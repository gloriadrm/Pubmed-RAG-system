services:

  qdrant:
    image: qdrant/qdrant:latest   # idealmente fijar versión concreta, ej: qdrant/qdrant:v1.13.0
    container_name: qdrant_ncbi_db
    command: "./qdrant --config-path /config/config.yaml"
    ports:
      - "6333:6333"
      - "6344:6344"
    volumes:
      - ./qdrant_data:/qdrant/storage
      - ./qdrant_config:/config/config.yaml
    restart: always

  api:
    build: .
    container_name: biomedical_rag_api
    ports:
      - "8000:8000"
    environment:
      # Qdrant: usa el nombre del servicio en la red interna de Docker
      - QDRANT_URL=http://qdrant:6333
      # Ollama corre en el host (Mac), no dentro de Docker
      # host.docker.internal resuelve a la IP del Mac desde dentro del contenedor
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      # Datos persistentes (OA CSV, last_update tracker)
      - ./data:/app/data
      # Caché del modelo bge-m3 — evita re-descargarlo en cada rebuild
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env          # NCBI_API_KEY y otras credenciales
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  huggingface_cache:
